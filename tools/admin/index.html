<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Dashboard</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-8">
    <h1 class="text-3xl font-bold mb-8">Service Dashboard</h1>

    <div id="dashboard"></div>

    <script>
        // 서비스 데이터 (샘플 몇 개만 넣음. 네 355개로 교체 가능)
        const services = [
            {
                id: "wp-data",
                name: "WP Data",
                category: "Core Services",
                url: "https://www.wp-data.com",
            },
            {
                id: "wp-sale-now",
                name: "WP Sale Now",
                category: "Core Services",
                url: "https://www.wpsalenow.com",
            },
            {
                id: "auto-money-talk-kr",
                name: "Auto Money Talk (KR)",
                category: "Auto Money Platforms",
                url: "https://www.automoneytalk.com/kr/",
            },
        ];

        // 카테고리 그룹화
        const categories = [...new Set(services.map((s) => s.category))];

        const dashboard = document.getElementById("dashboard");

        categories.forEach((category) => {
            const section = document.createElement("section");
            section.className = "mb-12";

            const title = document.createElement("h2");
            title.className = "text-xl font-semibold mb-4";
            title.textContent = category;

            const grid = document.createElement("div");
            grid.className = "grid grid-cols-1 md:grid-cols-3 gap-4";

            services
                .filter((s) => s.category === category)
                .forEach((service) => {
                    const card = document.createElement("div");
                    card.className =
                        "border p-4 rounded shadow hover:shadow-lg bg-white";

                    const h3 = document.createElement("h3");
                    h3.className = "text-lg font-bold mb-2";
                    h3.textContent = service.name;

                    const p = document.createElement("p");
                    p.className = "text-sm text-gray-600 mb-2";
                    p.textContent = service.category;

                    const link = document.createElement("a");
                    link.href = service.url;
                    link.target = "_blank";
                    link.className =
                        "inline-block text-blue-600 hover:underline text-sm";
                    link.textContent = "Go to Service";

                    card.appendChild(h3);
                    card.appendChild(p);
                    card.appendChild(link);

                    grid.appendChild(card);
                });

            section.appendChild(title);
            section.appendChild(grid);
            dashboard.appendChild(section);
        });
    </script>
</body>

</html>
